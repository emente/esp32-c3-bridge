[platformio]
default_envs = supermini
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_eol = LF
lib_deps =
    https://github.com/bertrik/minishell
    bblanchon/ArduinoJson@^6.21.6
    ESP32Async/ESPAsyncWebServer@^3.11.2
    knolleary/PubSubClient@^2.8.0
extra_scripts = pre:git_version.py, pre:platformio_guard.py

[env:supermini]
board = az-delivery-devkit-v4
build_flags =
    -D LED_BUILTIN=2
; monitor_filters = esp32_exception_decoder

; Wireless firmware upload over ArduinoOTA, once a device is already on the
; network (no USB cable needed). See README.md for usage.
[env:supermini_ota]
board = az-delivery-devkit-v4
build_flags =
    -D LED_BUILTIN=2
upload_protocol = espota
; fixed OTA hostname for this network
upload_port = its-bridge.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
